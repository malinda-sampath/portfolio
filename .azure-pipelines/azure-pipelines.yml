trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
# 1. Fetch secrets
- job: FetchSecrets
  steps:
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        KeyVaultName: 'malindaKeyVault01'
        SecretsFilter: '*'
        RunAsPreJob: false

# 2. Build React app
- job: BuildApp
  dependsOn: FetchSecrets
  steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm ci
        npm run build
      displayName: 'Build React Vite app'

# 3. Build & push Docker image
- job: BuildImage
  dependsOn: BuildApp
  steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'azure-acr-sc'
        repository: 'portfolio'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'   # or portfolio/Dockerfile if in subfolder
        tags: |
          $(Build.BuildId)

# 4. Deploy to AKS
- job: Deploy
  dependsOn: BuildImage
  steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials \
            --resource-group $(AKS-RESOURCE-GROUP) \
            --name $(AKS-CLUSTER) \
            --overwrite-existing

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/portfolio
