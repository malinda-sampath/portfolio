trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
# 1. Fetch secrets from Key Vault
- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'azure-sc-dev'   # Service connection name
    KeyVaultName: 'malindaKeyVault01'
    SecretsFilter: '*'
    RunAsPreJob: false

# 2. Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

# 3. Build React Vite app
- script: |
    npm ci
    npm run build
  displayName: 'Build React Vite app'

# 4. Build and push Docker image to ACR
- task: Docker@2
  inputs:
    containerRegistry: 'azure-acr-sc'   # <-- ACR service connection name
    repository: 'portfolio'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(Build.BuildId)

# 5. Deploy to AKS
- task: AzureCLI@2
  inputs:
    azureSubscription: 'azure-sc-dev'   # <-- same service connection
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az aks get-credentials \
        --resource-group $(AKS-RESOURCE-GROUP) \
        --name $(AKS-CLUSTER) \
        --overwrite-existing

      kubectl set image deployment/portfolio portfolio=$(ACR-NAME).azurecr.io/portfolio:$(Build.BuildId)
      kubectl rollout status deployment/portfolio
