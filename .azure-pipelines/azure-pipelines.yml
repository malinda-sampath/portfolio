trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  AKS_RESOURCE_GROUP: 'myResourceGroup'
  AKS_CLUSTER: 'mySingleNodeCluster'

jobs:

# 1. Build React app
- job: BuildApp
  steps:
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        KeyVaultName: 'malindaKeyVault01'
        SecretsFilter: '*'
        RunAsPreJob: true
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'
    - script: |
        npm ci
        npm run build
      displayName: 'Build React Vite app'

# 2. Build & push Docker image
- job: BuildImage
  dependsOn: BuildApp
  steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'azure-acr-sc'
        repository: 'portfolio'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(Build.BuildId)

# 3. Deploy to AKS
- job: Deploy
  dependsOn: BuildImage
  steps:
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        KeyVaultName: 'malindaKeyVault01'
        SecretsFilter: 'ACR-NAME'   # only pull what this job actually needs
        RunAsPreJob: true

    - task: KubectlInstaller@0
      inputs:
        kubectlVersion: 'latest'
      displayName: 'Install kubectl'

    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -euo pipefail
          echo "Using RG=$(AKS_RESOURCE_GROUP), Cluster=$(AKS_CLUSTER)"

          az aks get-credentials \
            --resource-group $(AKS_RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          export ACR_NAME="$(ACR-NAME)"
          export BUILD_ID="$(Build.BuildId)"

          if [ -z "$ACR_NAME" ]; then
            echo "ERROR: ACR_NAME is empty — check Key Vault secret name/permissions"
            exit 1
          fi

          envsubst < k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

          echo "Waiting for rollout..."
          kubectl rollout status deployment/portfolio --timeout=180s

          echo "External IP:"
          kubectl get service portfolio-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      displayName: 'Deploy to AKS'
