trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: CI_CD
  steps:
    # 1. Fetch secrets
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        KeyVaultName: 'malindaKeyVault01'
        SecretsFilter: 'AKS-RESOURCE-GROUP,AKS-CLUSTER'

    # 2. Build React app
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: 'Install Node.js'

    - script: |
        npm ci
        npm run build
      displayName: 'Build React Vite app'

    # 3. Build & push Docker image
    - task: Docker@2
      inputs:
        containerRegistry: 'azure-acr-sc'
        repository: 'portfolio'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(Build.BuildId)

    # 4. Deploy to AKS
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "RG=$AKS_RESOURCE_GROUP, Cluster=$AKS_CLUSTER"

          az aks get-credentials \
            --resource-group $AKS_RESOURCE_GROUP \
            --name $AKS_CLUSTER \
            --overwrite-existing

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/portfolio

          echo "Public IP:"
          kubectl get service portfolio-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
